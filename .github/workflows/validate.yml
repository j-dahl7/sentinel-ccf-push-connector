name: Validate CCF Push lab safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install locked test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements.txt

      - name: Compile Bicep without deploying resources
        run: |
          az bicep install --version v0.45.6
          az bicep build --file bicep/main.bicep --stdout >/dev/null

      - name: Require PowerShell for the deployment mocks
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()

      - name: Run offline sender and rule API tests
        run: python -m unittest discover -s tests -v

      - name: Check out the reviewed Microsoft packaging tool without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Azure/Azure-Sentinel
          ref: f6cc4352c34b84d781735967808cfc953376e7f2
          persist-credentials: false
          path: .packaging-tooling
          sparse-checkout: |
            Tools/Create-Azure-Sentinel-Solution
            Solutions/Templates

      - name: Generate and structurally verify the CCF package without Azure
        shell: pwsh
        run: ./scripts/Build-CCFPackage.ps1 -AzureSentinelRoot .packaging-tooling
